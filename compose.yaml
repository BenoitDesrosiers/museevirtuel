# Podman / Docker Compose — Muse
#
# Développement (code monté + Vite) :
#   cp .env.docker.example .env
#   podman compose --profile dev up --build
#
# Production (assets compilés dans l'image) :
#   cp .env.docker.example .env
#   podman compose --profile prod up --build -d

name: muse

x-laravel-env: &laravel-env
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    FILESYSTEM_DISK: public

x-app-base: &app-base
    build:
        context: .
        dockerfile: Dockerfile
        target: runtime
    image: muse-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
        <<: *laravel-env
    networks:
        - muse
    depends_on:
        mysql:
            condition: service_healthy

services:
    mysql:
        image: mysql:8.4
        restart: unless-stopped
        env_file: .env
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        networks:
            - muse
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            retries: 5
            timeout: 5s
            interval: 10s

    app:
        <<: *app-base
        profiles: [dev]
        environment:
            <<: *laravel-env
            APP_ENV: local
            APP_DEBUG: 'true'
            VITE_DEV_SERVER_URL: '${VITE_DEV_SERVER_URL:-http://localhost:5173}'
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html
            - node_modules_data:/var/www/html/node_modules

    queue:
        <<: *app-base
        profiles: [dev]
        environment:
            <<: *laravel-env
            APP_ENV: local
            APP_DEBUG: 'true'
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--timeout=90']
        volumes:
            - .:/var/www/html
            - node_modules_data:/var/www/html/node_modules

    vite:
        image: node:22-alpine
        profiles: [dev]
        restart: unless-stopped
        working_dir: /var/www/html
        env_file: .env
        command: ['sh', '-c', 'npm ci && npm run dev -- --host 0.0.0.0 --port 5173']
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html
            - node_modules_data:/var/www/html/node_modules
        networks:
            - muse

    app-prod:
        <<: *app-base
        profiles: [prod]
        environment:
            <<: *laravel-env
            APP_ENV: production
            APP_DEBUG: 'false'
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - storage_data:/var/www/html/storage/app/public

    queue-prod:
        <<: *app-base
        profiles: [prod]
        environment:
            <<: *laravel-env
            APP_ENV: production
            APP_DEBUG: 'false'
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--timeout=90']
        volumes:
            - storage_data:/var/www/html/storage/app/public

networks:
    muse:
        driver: bridge

volumes:
    mysql_data:
    node_modules_data:
    storage_data:
